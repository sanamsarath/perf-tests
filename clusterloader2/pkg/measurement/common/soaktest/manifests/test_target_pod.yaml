apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: test-redirect-target-daemonset
  namespace: busybox
  labels:
    app: test-target
spec:
  selector:
    matchLabels:
      app: test-target
  template:
    metadata:
      labels:
        app: test-target
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      hostNetwork: false
      restartPolicy: Always
      nodeSelector:
        slo: "true"
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists