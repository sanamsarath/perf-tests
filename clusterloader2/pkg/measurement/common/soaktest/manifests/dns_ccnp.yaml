apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-client-dns-access
spec:
  endpointSelector:
    matchLabels:
      app: client
  egress:
  # Allow client pods to resolve server services via DNS
  - toEndpoints:
    - matchLabels:
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow client pods to use NodeLocalDNS cache
  - toEndpoints:
    - matchLabels:
        k8s-app: node-local-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow client pods to access Kubernetes API server for service discovery
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  # Allow client pods to connect to server services after DNS resolution
  - toEndpoints:
    - matchLabels:
        app: target
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP